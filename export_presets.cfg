html/head_include="<script>
// Pointer lock: Chrome returns a promise that rejects when the lock is asked for outside a click (Godot asks on the
// next frame); the rejection is harmless (the next click locks) but would show as an uncaught page error.
(function(){
  const rpl = Element.prototype.requestPointerLock;
  if (rpl) Element.prototype.requestPointerLock = function(){ try { const r = rpl.apply(this, arguments); if (r && r.catch) r.catch(function(){}); return r; } catch (e) {} };
})();
// ECHOES: big files are served as numbered 880 KB parts (static hosting limit) and stitched back together on fetch.
// window.__ECHOES_PARTS__ = {'index.pck': n, 'index.wasm': m} is written into the page by the release script.
(function(){
  const PARTS = window.__ECHOES_PARTS__ || {};
  const orig = window.fetch.bind(window);
  window.__ECHOES_PROGRESS__ = {done: 0, total: 0};
  for (const k in PARTS) window.__ECHOES_PROGRESS__.total += PARTS[k];
  async function getPart(name, i) {
    for (let a = 0; a < 4; a++) {
      try { const r = await orig(name + '.part' + String(i).padStart(4, '0')); if (r.ok) return await r.arrayBuffer(); } catch (e) {}
      await new Promise(res => setTimeout(res, 600 * (a + 1)));
    }
    throw new Error('could not download part ' + i + ' of ' + name);
  }
  window.fetch = async function(input, init){
    const url = (typeof input === 'string') ? input : (input && input.url) || '';
    const name = url.split('?')[0].split('/').pop();
    const n = PARTS[name];
    if (!n) return orig(input, init);
    const bufs = new Array(n); let next = 0;
    async function worker(){ while (next < n) { const i = next++; bufs[i] = await getPart(name, i); window.__ECHOES_PROGRESS__.done++; } }
    await Promise.all(Array.from({length: 8}, worker));
    const type = name.endsWith('.wasm') ? 'application/wasm' : 'application/octet-stream';
    const total = bufs.reduce((a, b) => a + b.byteLength, 0);
    return new Response(new Blob(bufs, {type}), {status: 200, headers: {'Content-Type': type, 'Content-Length': String(total)}});
  };
})();
</script>
<style>body{background:#000}</style>"
